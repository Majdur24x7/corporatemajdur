<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>कॉर्पोरेट मज़दूर - Corporate Mazdoor Radio</title>
    
    <!-- Speed Optimization for Fonts (Montserrat Included) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Rozha+One&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            width: 100%; 
            height: 100%; 
            font-family: 'Montserrat', sans-serif; 
            overflow: hidden; 
            background-color: #0d0d11; 
            color: #ffffff; 
        }

        .hero-container {
            position: relative; 
            width: 100vw; 
            height: 100vh;
            height: 100dvh; /* Mobile viewport height fix */
            background-image: linear-gradient(180deg, rgba(10, 10, 14, 0.55) 0%, rgba(10, 10, 14, 0.85) 100%), url('images/musicmajdur.png');
            background-size: cover; 
            background-position: center;
            display: flex; 
            flex-direction: column; 
            justify-content: space-between; 
            padding: 20px 24px;
        }

        /* Top Bar */
        .top-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            width: 100%; 
            z-index: 10; 
        }
        
        .status-badge { 
            background: rgba(20, 20, 25, 0.65); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 12px; 
            display: flex; 
            align-items: center; 
            gap: 8px; 
            font-weight: 500; 
        }
        
        .status-dot { 
            width: 7px; 
            height: 7px; 
            background-color: #22c55e; 
            border-radius: 50%; 
            box-shadow: 0 0 8px #22c55e; 
        }
        
        .top-right-info { display: flex; align-items: center; gap: 8px; }
        
        .info-pill { 
            background: rgba(20, 20, 25, 0.65); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12); 
            padding: 6px 14px; 
            border-radius: 20px; 
            font-size: 11px; 
            letter-spacing: 1.2px; 
            font-weight: 600; 
            color: #d1d5db; 
        }

        /* Nav Songs Button */
        .nav-btn {
            background: rgba(20, 20, 25, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            font-family: 'Montserrat', sans-serif;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* Center Content Responsive */
        .center-content { 
            text-align: center; 
            z-index: 10; 
            margin-top: auto; 
            margin-bottom: auto; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%;
            padding: 0 10px;
        }
        
        .hindi-title { 
            font-family: 'Rozha One', serif; 
            font-size: clamp(42px, 8vw, 110px); 
            font-weight: 700; 
            line-height: 1.05; 
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85); 
            color: #ffffff; 
            margin-bottom: 12px; 
        }
        
        .english-subtitle { 
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(10px, 1.2vw, 14px); 
            letter-spacing: clamp(2px, 0.5vw, 5px); 
            text-transform: uppercase; 
            color: rgba(255, 255, 255, 0.85); 
            margin-bottom: 16px; 
            font-weight: 600; 
        }
        
        .meta-line { 
            font-family: 'Montserrat', sans-serif;
            font-size: clamp(9px, 1vw, 11px); 
            letter-spacing: clamp(1px, 0.3vw, 2.5px); 
            color: rgba(255, 255, 255, 0.6); 
            text-transform: uppercase; 
            margin-bottom: 24px; 
            max-width: 90%;
            font-weight: 500;
        }

        /* CTA Button */
        .cta-btn {
            background: rgba(255, 255, 255, 0.12); 
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.25); 
            color: #ffffff;
            padding: 12px 26px; 
            border-radius: 30px; 
            font-size: 13px; 
            font-weight: 600;
            letter-spacing: 1px; 
            text-decoration: none; 
            display: inline-flex; 
            align-items: center; 
            gap: 8px;
            transition: all 0.3s ease; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.4); 
            cursor: pointer;
            font-family: 'Montserrat', sans-serif;
        }
        .cta-btn:hover { background: rgba(255, 255, 255, 0.25); border-color: rgba(255, 255, 255, 0.5); transform: translateY(-2px); }
        .cta-btn svg { transition: transform 0.3s ease; }
        .cta-btn:hover svg { transform: translateX(4px); }

        /* Player Bar Responsive & Lifted Up */
        .bottom-section { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            gap: 14px; 
            width: 100%; 
            z-index: 10; 
            margin-bottom: 25px; /* Lifted up from bottom */
        }
        
        .player-card {
            background: rgba(18, 18, 22, 0.82); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px; 
            padding: 8px 20px 8px 12px; 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            width: 100%; 
            max-width: 620px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        /* Album Art Image Box */
        .album-art-box { 
            width: 42px; 
            height: 42px; 
            border-radius: 50%; 
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.25); 
            flex-shrink: 0; 
            display: flex;
            align-items: center;
            justify-content: center;
            background: #1e1e24;
        }

        .album-art-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .track-info { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
        .track-title { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .track-artist { font-size: 10px; color: #9ca3af; margin-top: 2px; font-weight: 500; }

        .controls-group { display: flex; align-items: center; gap: 6px; }
        .ctrl-btn { background: transparent; border: none; color: #9ca3af; cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center; transition: color 0.2s; padding: 4px; }
        .ctrl-btn:hover { color: #ffffff; }

        .play-btn { width: 36px; height: 36px; border-radius: 50%; background: rgba(255, 255, 255, 0.18); border: 1px solid rgba(255, 255, 255, 0.25); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease; }
        .play-btn:hover { background: rgba(255, 255, 255, 0.35); transform: scale(1.05); }

        .time-display { font-size: 10px; font-family: 'Montserrat', monospace; color: #9ca3af; min-width: 65px; text-align: right; font-weight: 500; }

        /* Footer Info Section (Location & Instagram Icons) */
        .footer-info {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            color: rgba(255, 255, 255, 0.65);
            text-transform: uppercase;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: rgba(255, 255, 255, 0.65);
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-item:hover {
            color: #ffffff;
        }

        .footer-item svg {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        #youtubePlayer { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

        /* Mobile Adjustments (Screen < 600px) */
        @media (max-width: 600px) {
            .hero-container { padding: 16px; }
            .bottom-section { margin-bottom: 15px; }
            .player-card { padding: 8px 14px; border-radius: 30px; }
            .time-display { display: none; } 
            .footer-info { gap: 14px; font-size: 10px; }
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>1,142 on.shift</span>
            </div>
            <div class="top-right-info">
                <!-- Only Songs Button -->
                <button class="nav-btn">Songs</button>
                
                <div class="info-pill" id="liveClock">00:00:00 AM</div>
            </div>
        </div>

        <!-- Center Section -->
        <div class="center-content">
            <h1 class="hindi-title">कॉर्पोरेट मज़दूर</h1>
            <div class="english-subtitle">CORPORATE MAZDOOR • OVERTIME ALL HOURS</div>
            <div class="meta-line">KAAM KA PRESSURE, MUSIC KA SUKOON — JAHAN HAR BEAT KE SAATH, CORPORATE LIFE THODI AUR EASY LAGE</div>

            <!-- CTA Button -->
            <a href="https://www.corporatemajdur.com/#stories-section" target="_blank" rel="noopener noreferrer" class="cta-btn">
                <span>मज़दूर की कहानी पढ़ें</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>

        <!-- Player Section with Footer Icons (Location + Instagram) -->
        <div class="bottom-section">
            <div class="player-card">
                <!-- Direct Album Thumbnail Image -->
                <div class="album-art-box">
                    <img id="albumArtImg" src="" alt="Album Cover">
                </div>

                <div class="track-info">
                    <div class="track-title" id="trackTitle">Loading...</div>
                    <div class="track-artist" id="trackArtist">Corporate Mazdoor Radio</div>
                </div>

                <div class="controls-group">
                    <button class="ctrl-btn" onclick="prevSong()" title="Previous Song">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="19,20 9,12 19,4"></polygon>
                            <line x1="5" y1="4" x2="5" y2="20" stroke="currentColor" stroke-width="2"></line>
                        </svg>
                    </button>

                    <button class="play-btn" id="playBtn" onclick="togglePlay()">
                        <svg id="playIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5,3 19,12 5,21"></polygon>
                        </svg>
                    </button>

                    <button class="ctrl-btn" onclick="nextSong()" title="Next Song">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5,4 15,12 5,20"></polygon>
                            <line x1="19" y1="4" x2="19" y2="20" stroke="currentColor" stroke-width="2"></line>
                        </svg>
                    </button>
                </div>

                <div class="time-display" id="timeDisplay">0:00 / 0:00</div>
            </div>

            <!-- Footer Location & Instagram Section -->
            <div class="footer-info">
                <!-- Location Item -->
                <div class="footer-item">
                    <svg viewBox="0 0 24 24">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                    <span>India</span>
                </div>

                <!-- Instagram Item -->
                <a href="https://instagram.com/corporatemazdoor" target="_blank" rel="noopener noreferrer" class="footer-item">
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                        <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                        <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
                    </svg>
                    <span>@corporatemazdoor</span>
                </a>
            </div>
        </div>
    </div>

    <div id="youtubePlayer"></div>

    <!-- Optimized YouTube Async Script -->
    <script async src="https://www.youtube.com/iframe_api"></script>
    <script>
        // Real-time Live Clock Optimization
        function updateLiveClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12 ? hours % 12 : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            document.getElementById('liveClock').innerText = `${hours}:${minutes}:${seconds} ${ampm}`;
        }
        setInterval(updateLiveClock, 1000);
        updateLiveClock();

        // YouTube Playlist Config
        const youtubePlaylist = [
            { videoId: "jfKfPfyJRdk", title: "Lofi Hip Hop Beats — Relax / Study", artist: "Lofi Girl" },
            { videoId: "5qap5aO4i9A", title: "Late Night Chill Vibes", artist: "Corporate Mazdoor Radio" },
            { videoId: "DWcU19ZY440", title: "Deep Focus Coding Beats", artist: "Overtime Vibes" }
        ];

        let currentSongIndex = 0;
        let ytPlayer = null;
        let isPlaying = false;
        let timerInterval = null;

        // Load Track details initially without waiting for player state
        updateTrackUI();

        function updateTrackUI() {
            const currentSong = youtubePlaylist[currentSongIndex];
            document.getElementById('trackTitle').innerText = currentSong.title;
            document.getElementById('trackArtist').innerText = currentSong.artist;
            // Fetch YouTube HQ Thumbnail image directly
            document.getElementById('albumArtImg').src = `https://img.youtube.com/vi/${currentSong.videoId}/hqdefault.jpg`;
        }

        function onYouTubeIframeAPIReady() {
            ytPlayer = new YT.Player('youtubePlayer', {
                height: '1', width: '1',
                videoId: youtubePlaylist[currentSongIndex].videoId,
                playerVars: { 'playsinline': 1, 'controls': 0, 'disablekb': 1 },
                events: {
                    'onReady': () => updateTrackUI(),
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function togglePlay() {
            if (!ytPlayer) return;
            if (isPlaying) ytPlayer.pauseVideo();
            else ytPlayer.playVideo();
        }

        function onPlayerStateChange(event) {
            const playIcon = document.getElementById('playIcon');
            if (event.data == YT.PlayerState.PLAYING) {
                isPlaying = true;
                playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
                startProgressTimer();
            } else {
                isPlaying = false;
                playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"></polygon>';
                stopProgressTimer();
            }
            if (event.data == YT.PlayerState.ENDED) nextSong();
        }

        function nextSong() {
            currentSongIndex = (currentSongIndex + 1) % youtubePlaylist.length;
            updateTrackUI();
            if (ytPlayer) ytPlayer.loadVideoById(youtubePlaylist[currentSongIndex].videoId);
        }

        function prevSong() {
            currentSongIndex = (currentSongIndex - 1 + youtubePlaylist.length) % youtubePlaylist.length;
            updateTrackUI();
            if (ytPlayer) ytPlayer.loadVideoById(youtubePlaylist[currentSongIndex].videoId);
        }

        function startProgressTimer() {
            stopProgressTimer();
            timerInterval = setInterval(() => {
                if (ytPlayer && ytPlayer.getCurrentTime) {
                    const currentTime = ytPlayer.getCurrentTime() || 0;
                    const duration = ytPlayer.getDuration() || 0;
                    let cMin = Math.floor(currentTime / 60), cSec = Math.floor(currentTime % 60);
                    if (cSec < 10) cSec = '0' + cSec;
                    let dMin = Math.floor(duration / 60), dSec = Math.floor(duration % 60);
                    if (dSec < 10) dSec = '0' + dSec;
                    
                    const timeElem = document.getElementById('timeDisplay');
                    if(timeElem) timeElem.innerText = `${cMin}:${cSec} / ${dMin}:${dSec}`;
                }
            }, 1000);
        }

        function stopProgressTimer() { if (timerInterval) clearInterval(timerInterval); }
    </script>
</body>
</html>
