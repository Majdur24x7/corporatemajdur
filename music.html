<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>कॉर्पोरेट मज़दूर - Corporate Mazdoor Radio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            background-color: #0d0d11;
            color: #ffffff;
        }

        /* Fullscreen Hero Background Container */
        .hero-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: linear-gradient(180deg, rgba(10, 10, 14, 0.4) 0%, rgba(10, 10, 14, 0.75) 100%), url('images/musicmajdur.png');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 40px;
        }

        /* Top Navigation Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            z-index: 10;
        }

        .status-badge {
            background: rgba(20, 20, 25, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background-color: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        .top-right-info {
            display: flex;
            gap: 10px;
        }

        .info-pill {
            background: rgba(20, 20, 25, 0.65);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            letter-spacing: 1.5px;
            font-weight: 600;
            color: #d1d5db;
        }

        /* Center Main Typography */
        .center-content {
            text-align: center;
            z-index: 10;
            margin-top: auto;
            margin-bottom: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .hindi-title {
            font-family: 'Rozha One', serif;
            font-size: clamp(64px, 9vw, 130px);
            font-weight: 700;
            line-height: 0.95;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
            color: #ffffff;
            margin-bottom: 8px;
        }

        .english-subtitle {
            font-size: clamp(12px, 1.3vw, 16px);
            letter-spacing: 6px;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 24px;
            font-weight: 500;
        }

        .meta-line {
            font-size: 11px;
            letter-spacing: 3px;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
        }

        /* Bottom Floating Audio Player */
        .bottom-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            width: 100%;
            z-index: 10;
        }

        .player-card {
            background: rgba(18, 18, 22, 0.75);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 50px;
            padding: 8px 24px 8px 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            max-width: 580px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .album-art {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: #2a2a35;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: #9ca3af;
        }

        .track-info {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .track-title {
            font-size: 13px;
            font-weight: 600;
        }

        .track-artist {
            font-size: 11px;
            color: #9ca3af;
            margin-top: 2px;
        }

        .play-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .play-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        .time-display {
            font-size: 11px;
            font-family: monospace;
            color: #9ca3af;
        }

        /* Footer Info */
        .footer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            font-size: 11px;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
        }

        .action-icons {
            display: flex;
            gap: 16px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.6);
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <!-- Top Status Bar -->
        <div class="top-bar">
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>1,142 on.shift</span>
            </div>
            <div class="top-right-info">
                <div class="info-pill">AHMEDABAD</div>
                <div class="info-pill">09:30 — 18:30</div>
            </div>
        </div>

        <!-- Main Heading Text -->
        <div class="center-content">
            <h1 class="hindi-title">कॉर्पोरेट मज़दूर</h1>
            <div class="english-subtitle">CORPORATE MAZDOOR • OVERTIME ALL HOURS</div>
            <div class="meta-line">AARAV MEHTA | SENIOR BUSINESS ANALYST | STRATEGY & OPERATIONS</div>
        </div>

        <!-- Player Bar & Bottom Controls -->
        <div class="bottom-section">
            <div class="player-card">
                <div class="album-art">CM</div>
                <div class="track-info">
                    <div class="track-title">Dusk Shift — ambient loop</div>
                    <div class="track-artist">Corporate Mazdoor radio</div>
                </div>
                <button class="play-btn" id="playBtn" onclick="togglePlay()">
                    <svg id="playIcon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                        <polygon points="5,3 19,12 5,21"></polygon>
                    </svg>
                </button>
                <div class="time-display" id="timeDisplay">0:00 / 3:51</div>
            </div>

            <!-- Footer Bar -->
            <div class="footer-bar">
                <div>DESK 42</div>
                <div class="action-icons">
                    <button class="icon-btn">⛶</button>
                    <button class="icon-btn">T</button>
                    <button class="icon-btn">✎</button>
                    <button class="icon-btn">💬</button>
                </div>
                <div>INDIA</div>
            </div>
        </div>
    </div>

    <!-- Interactive JavaScript -->
    <audio id="audioPlayer" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"></audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');
        const timeDisplay = document.getElementById('timeDisplay');
        let isPlaying = false;

        function togglePlay() {
            if (isPlaying) {
                audio.pause();
                playIcon.innerHTML = '<polygon points="5,3 19,12 5,21"></polygon>';
            } else {
                audio.play();
                playIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
            }
            isPlaying = !isPlaying;
        }

        audio.ontimeupdate = function() {
            let currentMin = Math.floor(audio.currentTime / 60);
            let currentSec = Math.floor(audio.currentTime % 60);
            if (currentSec < 10) currentSec = '0' + currentSec;

            let durationMin = Math.floor(audio.duration / 60) || 3;
            let durationSec = Math.floor(audio.duration % 60) || 51;
            if (durationSec < 10) durationSec = '0' + durationSec;

            timeDisplay.innerText = `${currentMin}:${currentSec} / ${durationMin}:${durationSec}`;
        };
    </script>
</body>
</html>
