<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memes | Corporate Majdur</title>
    
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            font-family: Inter, Arial, sans-serif;
            background: #050914;
            color: #ffffff;
        }
        .meme-card {
            background: linear-gradient(145deg, rgba(17, 24, 39, 0.95), rgba(8, 15, 30, 0.95));
            border: 1px solid rgba(96, 165, 250, 0.12);
            transition: all 0.3s ease;
        }
        .meme-card:hover {
            border-color: rgba(96, 165, 250, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header class="w-full max-w-7xl mx-auto px-4 md:px-6 py-4 flex justify-center items-center relative z-20 border-b border-blue-500/10">
        <a href="/" class="flex items-center gap-3 group">
            <div class="h-10 flex items-center justify-center overflow-hidden bg-transparent">
                <img src="images/logo.png" alt="Corporate Majdur Logo" class="h-full w-auto object-contain">
            </div>
        </a>
    </header>

    <main class="max-w-7xl mx-auto px-4 md:px-8 py-10">

        <!-- DYNAMIC TITLE SECTION -->
        <div class="mb-8 text-center">
            <span id="categoryTag" class="px-4 py-1.5 rounded-full bg-blue-500/10 text-blue-400 text-xs font-semibold tracking-wide uppercase border border-blue-400/20">
                Category
            </span>
            <h1 id="categoryTitle" class="text-3xl md:text-4xl font-black mt-3 capitalize">
                Loading...
            </h1>
            <p class="text-gray-400 text-sm mt-2">
                Click any meme to open it in a popup and read it clearly!
            </p>
        </div>

        <!-- DYNAMIC MEME GRID CONTAINER -->
        <div id="memeGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
            <!-- Memes yahan JavaScript automatically inject karega -->
        </div>

    </main>

    <!-- FULL SCREEN POPUP MODAL -->
    <div id="memeModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm hidden p-4">
        <div class="relative bg-[#0b1329] border border-blue-500/20 rounded-2xl max-w-xl w-full overflow-hidden shadow-2xl p-6">
            
            <button onclick="closeModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white bg-white/10 hover:bg-white/20 rounded-full w-8 h-8 flex items-center justify-center transition-colors text-sm font-bold z-10">
                ✕
            </button>

            <div class="w-full bg-black rounded-lg overflow-hidden flex items-center justify-center max-h-[70vh]">
                <img id="modalImage" src="" alt="Full Meme" class="max-h-[70vh] w-auto object-contain">
            </div>

            <div class="mt-4">
                <h3 id="modalTitle" class="font-bold text-white text-base leading-snug"></h3>
                <div class="flex items-center justify-between mt-4 pt-3 border-t border-gray-800">
                    <button class="text-sm text-gray-300 hover:text-red-400">❤️ Like</button>
                    <div class="flex gap-2">
                        <button onclick="alert('Downloaded!')" class="px-3 py-1.5 rounded-lg bg-blue-600 text-white text-xs font-semibold">Download</button>
                        <button onclick="alert('Shared!')" class="px-3 py-1.5 rounded-lg bg-white/10 text-white text-xs font-semibold">Share</button>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- IMPORT DATA FILE -->
    <script src="memes.js"></script>

    <!-- AUTOMATION SCRIPT -->
    <script>
        // 1. URL se category nikalna (jaise: category.html?cat=managers)
        const urlParams = new URLSearchParams(window.location.search);
        const currentCat = urlParams.get('cat') || 'office-life';

        // 2. Title aur Tag update karna
        document.getElementById('categoryTitle').innerText = currentCat.replace('-', ' ') + ' Memes';
        document.getElementById('categoryTag').innerText = currentCat.replace('-', ' ');

        // 3. Memes data fetch karke Grid banana
        const gridContainer = document.getElementById('memeGrid');
        const memesList = allMemesData[currentCat] || [];

        if (memesList.length === 0) {
            gridContainer.innerHTML = `<p class="text-gray-400 col-span-full text-center py-10">No memes found in this category yet!</p>`;
        } else {
            memesList.forEach(meme => {
                gridContainer.innerHTML += `
                    <div onclick="openModal('${meme.image}', '${meme.title.replace(/"/g, '&quot;')}')" class="meme-card rounded-xl overflow-hidden flex flex-col cursor-pointer">
                        <div class="bg-gray-900 overflow-hidden relative aspect-[4/3] flex items-center justify-center">
                            <img src="${meme.image}" alt="Office Meme" class="w-full h-full object-cover hover:scale-105 transition-transform duration-300">
                        </div>
                        <div class="p-4 flex flex-col flex-grow justify-between">
                            <h3 class="font-semibold text-sm text-white line-clamp-1 leading-snug">
                                ${meme.title}
                            </h3>
                            <div class="flex items-center justify-between mt-3 pt-3 border-top border-gray-800 text-xs text-gray-400 border-t border-gray-800">
                                <span>❤️ ${meme.likes}</span>
                                <span class="text-blue-400 font-medium">Click to Read →</span>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        // 4. Modal Open/Close Logic
        function openModal(src, title) {
            document.getElementById('modalImage').src = src;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('memeModal').classList.remove('hidden');
        }
        function closeModal() {
            document.getElementById('memeModal').classList.add('hidden');
        }
        window.onclick = function(e) {
            const modal = document.getElementById('memeModal');
            if (e.target === modal) closeModal();
        }
    </script>
</body>
</html>
