<div class="container">

<!-- =========================
     JAVASCRIPT
========================= -->

<script>


// =====================================================
// MEME DATA
// =====================================================

let memeData = {};

let isDataLoaded = false;


// =====================================================
// GOOGLE APPS SCRIPT API
// =====================================================

const API_URL =
"https://script.google.com/macros/s/AKfycbwuEZWvn8bRBC0nOY7ON1DcILqCmbm4m6--TqNhswplku9fjhJfcz_qSpHcRjOrWxFTnw/exec";


// =====================================================
// PAGE LOAD
// =====================================================

window.addEventListener("DOMContentLoaded", function(){

    console.log("⏳ Loading memes from Google Sheets...");


    fetch(API_URL)

        .then(response => {

            if(!response.ok){

                throw new Error(
                    "API Error: " + response.status
                );

            }

            return response.json();

        })


        .then(data => {

            console.log("✅ Meme data received:", data);


            memeData = data;

            isDataLoaded = true;


            // Generate categories

            generateCategoryGrid();


            // Check URL category

            checkCategoryFromURL();

        })


        .catch(error => {

            console.error(
                "❌ Meme API Error:",
                error
            );


            const grid =
                document.getElementById("gridContainer");


            if(grid){

                grid.innerHTML = `

                    <div style="
                        grid-column:1/-1;
                        text-align:center;
                        padding:60px 20px;
                    ">

                        <p style="
                            color:#ef4444;
                            font-size:20px;
                        ">
                            ❌ Unable to load memes.
                        </p>

                        <p style="
                            color:#94a3b8;
                            margin-top:10px;
                        ">
                            Please refresh the page.
                        </p>

                    </div>

                `;

            }

        });

});


// =====================================================
// GENERATE CATEGORY GRID
// =====================================================

function generateCategoryGrid(){


    const grid =
        document.getElementById("gridContainer");


    if(!grid){

        console.error(
            "❌ gridContainer not found"
        );

        return;

    }


    // Clear loader

    grid.innerHTML = "";


    const categories =
        Object.keys(memeData);


    console.log(
        "📂 Categories:",
        categories
    );


    categories.forEach(category => {


        const memeCount =
            Array.isArray(memeData[category])
                ? memeData[category].length
                : 0;


        const card =
            document.createElement("div");


        card.className = "card";


        // =================================================
        // CATEGORY CLICK
        // =================================================

        card.onclick = function(){

            const slug =
                encodeURIComponent(category);


            console.log(
                "➡️ Opening category:",
                category
            );


            window.location.href =
                "/memes/" + slug;

        };


        // =================================================
        // CATEGORY HTML
        // =================================================

        card.innerHTML = `

            <div class="icon">
                📝
            </div>

            <h3>
                ${category}
            </h3>

            <span>
                ${memeCount} Memes
            </span>

        `;


        grid.appendChild(card);

    });

}


// =====================================================
// CHECK CATEGORY FROM URL
// =====================================================

function checkCategoryFromURL(){


    const pathname =
        window.location.pathname;


    console.log(
        "🌐 Current URL:",
        pathname
    );


    const basePath =
        "/memes/";


    // =================================================
    // MAIN MEMES PAGE
    // =================================================

    if(
        pathname === "/memes" ||
        pathname === "/memes/"
    ){

        console.log(
            "🏠 Main memes page"
        );

        return;

    }


    // =================================================
    // CATEGORY PAGE
    // =================================================

    if(
        pathname.startsWith(basePath)
    ){


        let encodedCategory =
            pathname.substring(
                basePath.length
            );


        // Remove trailing slash

        encodedCategory =
            encodedCategory.replace(
                /\/$/,
                ""
            );


        if(!encodedCategory){

            return;

        }


        // Decode URL

        const category =
            decodeURIComponent(
                encodedCategory
            );


        console.log(
            "📂 Category from URL:",
            category
        );


        console.log(
            "📋 Available categories:",
            Object.keys(memeData)
        );


        // =================================================
        // CATEGORY FOUND
        // =================================================

        if(
            memeData.hasOwnProperty(category)
        ){

            console.log(
                "✅ Category found:",
                category
            );


            openPopup(category);


        }

        // =================================================
        // CATEGORY NOT FOUND
        // =================================================

        else{

            console.error(
                "❌ Category not found:",
                category
            );

        }

    }

}


// =====================================================
// POPUP VARIABLES
// =====================================================

let currentCategory = "";

let currentIndex = 0;

const perPage = 5;


// =====================================================
// OPEN POPUP
// =====================================================

function openPopup(category){


    if(!isDataLoaded){

        console.log(
            "⏳ Data is still loading..."
        );

        return;

    }


    // Set current category

    currentCategory =
        category;


    // Reset pagination

    currentIndex = 0;


    // Popup title

    document.getElementById(
        "popupTitle"
    ).innerText =
        category;


    // Clear old memes

    document.getElementById(
        "memeContainer"
    ).innerHTML = "";


    // Show popup

    document.getElementById(
        "memePopup"
    ).classList.remove(
        "hidden"
    );


    // Load first 5 memes

    loadMore();

}


// =====================================================
// LOAD MORE
// =====================================================

function loadMore(){


    const container =
        document.getElementById(
            "memeContainer"
        );


    const list =
        memeData[currentCategory] || [];


    console.log(
        "📖 Loading memes:",
        currentCategory,
        list
    );


    const end =
        Math.min(
            currentIndex + perPage,
            list.length
        );


    // =================================================
    // ADD MEMES
    // =================================================

    for(
        let i = currentIndex;
        i < end;
        i++
    ){


        const memeDiv =
            document.createElement(
                "div"
            );


        memeDiv.className =
            "meme-card";


        memeDiv.textContent =
            list[i];


        container.appendChild(
            memeDiv
        );

    }


    // Update index

    currentIndex =
        end;


    // =================================================
    // LOAD MORE BUTTON
    // =================================================

    const loadButton =
        document.getElementById(
            "loadMoreBtn"
        );


    if(
        currentIndex >= list.length
    ){

        loadButton.style.display =
            "none";

    }

    else{

        loadButton.style.display =
            "inline-block";

    }


    // =================================================
    // NO MEMES
    // =================================================

    if(list.length === 0){

        container.innerHTML = `

            <div style="
                text-align:center;
                padding:40px 20px;
                color:#94a3b8;
            ">

                😕 No memes found
                in this category.

            </div>

        `;

    }

}


// =====================================================
// CLOSE POPUP
// =====================================================

function closePopup(){


    // Hide popup

    document.getElementById(
        "memePopup"
    ).classList.add(
        "hidden"
    );


    // =================================================
    // CATEGORY URL → MAIN MEMES PAGE
    // =================================================

    if(
        window.location.pathname
            .startsWith("/memes/")
    ){

        window.location.href =
            "/memes";

    }

}


// =====================================================
// CLICK OUTSIDE POPUP
// =====================================================

document.getElementById(
    "memePopup"
).addEventListener(
    "click",
    function(e){

        if(
            e.target === this
        ){

            closePopup();

        }

    }
);


</script>
